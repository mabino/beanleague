# ==============================================================================
# BeanLeague Homelab Ingress Configuration (binolabs.com/beanleague)
# Add this block inside your 'server { server_name binolabs.com ... }' in homelab/web/nginx.conf
# ==============================================================================

        # BeanLeague — Login-less Fantasy Soccer Platform
        location = /beanleague {
            return 301 $scheme://$host/beanleague/;
        }
        location /beanleague/ {
            set $upstream_beanleague_frontend beanleague-frontend;
            proxy_pass http://$upstream_beanleague_frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Real-time Server-Sent Events (SSE) support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding on;
        }
